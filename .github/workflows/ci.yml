name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conduit-quality:
    name: conduit code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: conduit-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: conduit-backend/go.mod
          cache-dependency-path: conduit-backend/go.sum
      - run: make fmt-check
      - run: make vet
      - run: make tidy-check

  conduit-test:
    name: conduit code tests
    runs-on: ubuntu-latest
    needs: [conduit-quality]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: conduit-backend
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: conduit-backend/go.mod
          cache-dependency-path: conduit-backend/go.sum
      - run: make test/unit
      - run: make test/integration
      - run: make test/e2e

  conduit-docker:
    name: conduit docker container
    runs-on: ubuntu-latest
    needs: [conduit-test]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: conduit-docker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Prepare environment
        run: make docker/env
      - name: Start stack
        run: make docker/up
      - name: Check health endpoint
        run: curl -fsS http://localhost:8080/health
      - name: Check API
        run: |
          curl -fsS -X POST http://localhost:8080/api/v1/users \
            -H 'Content-Type: application/json' \
            -d '{"user":{"username":"ci_user","email":"ci_user@mail.com","password":"CiPassword123"}}'
      - name: Check seed
        run: make docker/seed
      - name: Check seeded articles
        run: curl -fsS http://localhost:8080/api/v1/articles
      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.local.yml ps -a
          docker inspect --format '{{json .State.Health}}' conduit-backend
          echo "=== backend logs"
          docker logs conduit-backend 2>&1 | tail -n 100
          echo "=== postgres logs"
          docker logs conduit-postgres 2>&1 | tail -n 30
      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.local.yml down -v
