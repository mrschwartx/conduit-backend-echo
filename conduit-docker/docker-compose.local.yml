services:
  conduit-mysql:
    image: mysql:8.4
    container_name: conduit-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-R00t_S9p!tBox_2026}
      MYSQL_DATABASE: ${DB_NAME:-conduit}
      MYSQL_USER: ${DB_USER:-conduit}
      MYSQL_PASSWORD: ${DB_PASSWORD:-S9p!tBox_2026@Db}
    ports:
      - "3306:3306"
    volumes:
      - conduit-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  conduit-backend:
    build:
      context: ../conduit-backend-echo
      dockerfile: ../conduit-docker/conduit-backend-echo/Dockerfile
    container_name: conduit-backend
    restart: unless-stopped
    depends_on:
      conduit-mysql:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_HOST: conduit-mysql
      DATABASE_PORT: "3306"
      DATABASE_NAME: ${DB_NAME:-conduit}
      DATABASE_USER: ${DB_USER:-conduit}
      DATABASE_PASSWORD: ${DB_PASSWORD:-S9p!tBox_2026@Db}
      # Local development only. Override JWT_SECRET (>= 32 chars) for anything else.
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-change-me-0123456789}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8080:8080"

volumes:
  conduit-mysql-data:
