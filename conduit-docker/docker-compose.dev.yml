services:
  conduit-postgres:
    image: postgres:18.3
    container_name: conduit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: conduit_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_pass
    ports:
      - "5432:5432"
    volumes:
      - conduit-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  conduit-pgadmin:
    image: dpage/pgadmin4:9
    container_name: conduit-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@conduit.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "8081:80"
    depends_on:
      conduit-postgres:
        condition: service_healthy

volumes:
  conduit-postgres-data:
